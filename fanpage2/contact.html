    <header class="entete">

    <main class="contenu">
      <h1>Contact</h1>

      <form id="form" novalidate>
        <div>
          <label for="nom">Nom</label>
          <input id="nom" type="text" placeholder="Ton nom" />
          <span class="err"></span>
        </div>

        <div>
          <label for="mail">Email</label>
          <input id="mail" type="email" placeholder="toi@exemple.com" />
          <span class="err"></span>
        </div>

        <div>
          <label for="msg">Message</label>
          <textarea id="msg" rows="5" placeholder="Ton message…"></textarea>
          <span class="err"></span>
        </div>

        <div>
          <button class="cta" type="submit">Envoyer</button>
        </div>

        <p id="res"></p>
      </form>
    </main>

      <nav>
